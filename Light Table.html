<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Light Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one large viewing stage on top, a strip of thumbnails below, controls in a slim bar. Safelight accent on cool neutrals. */
:root {
  --bg: #eef0f1;
  --surface: #f8f9f9;
  --stage: #e1e5e7;
  --fg: #1c2326;
  --muted: #5d696e;
  --line: #cdd4d7;
  --accent: #c4401a;
  --accent-fg: #ffffff;
  --focus: #1c6fb8;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121719;
    --surface: #1a2023;
    --stage: #0d1113;
    --fg: #e6eaec;
    --muted: #94a1a6;
    --line: #2d373b;
    --accent: #ee6a42;
    --accent-fg: #170a05;
    --focus: #6db3f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121719;
  --surface: #1a2023;
  --stage: #0d1113;
  --fg: #e6eaec;
  --muted: #94a1a6;
  --line: #2d373b;
  --accent: #ee6a42;
  --accent-fg: #170a05;
  --focus: #6db3f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
.sub { color: var(--muted); font-size: 0.875rem; margin: 2px 0 0; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button, .btn {
  font: inherit;
  font-weight: 500;
  font-size: 0.875rem;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
button:hover, .btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
button:focus-visible, .btn:focus-within, .thumb:focus-visible, .stage:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn { position: relative; }

.stage {
  position: relative;
  background: var(--stage);
  border: 1px solid var(--line);
  border-radius: 8px;
  min-height: 320px;
  height: min(62vh, 560px);
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 12px;
}
.stage.drag { border-color: var(--accent); border-style: dashed; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; border-radius: 2px; }

.empty { text-align: center; max-width: 30ch; padding: 16px; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 4px; }

.meta {
  display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline; justify-content: space-between;
  min-height: 24px;
}
.meta .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.meta .facts { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag {
  font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 8px; color: var(--muted);
}

.strip-head { display: flex; justify-content: space-between; align-items: baseline; }
.label { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.thumb-wrap { position: relative; min-width: 0; }
.thumb {
  display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; min-height: 0;
  border: 2px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--stage);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb[aria-current="true"] { border-color: var(--accent); }
.remove {
  position: absolute; top: 4px; right: 4px; min-height: 0; width: 24px; height: 24px; padding: 0;
  justify-content: center; border-radius: 50%; font-size: 0.875rem; line-height: 1;
  background: var(--surface); opacity: 0.92;
}
.hint { color: var(--muted); font-size: 0.8125rem; margin: 0; }

@media (max-width: 480px) {
  .stage { height: 52vh; min-height: 260px; }
  h1 { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .thumb, .stage { transition: border-color 0.15s ease; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Light Table</h1>
      <p class="sub">Add images, pick one, and view it large.</p>
    </div>
    <div class="actions">
      <label class="btn btn-primary" for="file">Add images
        <input id="file" type="file" accept="image/*" multiple>
      </label>
      <button id="clear" type="button">Clear all</button>
    </div>
  </header>

  <div id="stage" class="stage" tabindex="0" aria-label="Image viewing area"></div>
  <div class="meta" id="meta" aria-live="polite"></div>

  <section aria-label="Added images">
    <div class="strip-head">
      <span class="label">Images</span>
      <span class="label" id="count"></span>
    </div>
    <div id="strip" class="strip" role="list" style="margin-top:8px"></div>
  </section>

  <p class="hint">Drop files on the viewing area, paste an image, or use Add images. Files stay in your browser and are not uploaded anywhere.</p>
</div>

<script>
(function () {
  var items = [];
  var currentId = null;
  var nextId = 1;

  var stage = document.getElementById('stage');
  var meta = document.getElementById('meta');
  var strip = document.getElementById('strip');
  var count = document.getElementById('count');
  var fileInput = document.getElementById('file');
  var clearBtn = document.getElementById('clear');

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
  }
  function fmtPx(w, h) {
    var mp = (w * h) / 1e6;
    return w + ' × ' + h + ' px · ' + mp.toFixed(mp < 10 ? 2 : 1) + ' MP';
  }

  function addBlob(blob, name, sample) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        var it = { id: nextId++, name: name, url: url, size: blob.size, w: img.naturalWidth, h: img.naturalHeight, sample: !!sample };
        items.push(it);
        resolve(it);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function addFiles(files) {
    var list = Array.prototype.filter.call(files, function (f) { return /^image\//.test(f.type); });
    if (!list.length) return;
    // Real images replace the sample.
    items = items.filter(function (it) {
      if (it.sample) { URL.revokeObjectURL(it.url); return false; }
      return true;
    });
    Promise.all(list.map(function (f) { return addBlob(f, f.name || 'pasted-image'); })).then(function (added) {
      added = added.filter(Boolean);
      if (added.length) currentId = added[added.length - 1].id;
      render();
    });
  }

  function render() {
    // Stage
    var cur = items.filter(function (i) { return i.id === currentId; })[0];
    stage.textContent = '';
    meta.textContent = '';
    if (cur) {
      var img = document.createElement('img');
      img.src = cur.url;
      img.alt = cur.name;
      stage.appendChild(img);

      var n = document.createElement('div');
      n.className = 'name';
      n.textContent = cur.name;
      if (cur.sample) {
        var t = document.createElement('span');
        t.className = 'tag';
        t.textContent = 'Sample';
        n.appendChild(t);
      }
      var f = document.createElement('div');
      f.className = 'facts';
      f.textContent = fmtPx(cur.w, cur.h) + ' · ' + fmtSize(cur.size);
      meta.appendChild(n);
      meta.appendChild(f);
    } else {
      var e = document.createElement('div');
      e.className = 'empty';
      var s = document.createElement('strong');
      s.textContent = 'No image yet';
      e.appendChild(s);
      e.appendChild(document.createTextNode('Drop a file here or choose Add images to see it at full size.'));
      stage.appendChild(e);
    }

    // Strip
    strip.textContent = '';
    count.textContent = items.length + (items.length === 1 ? ' file' : ' files');
    items.forEach(function (it) {
      var wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      wrap.setAttribute('role', 'listitem');

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'thumb';
      b.setAttribute('aria-label', 'Show ' + it.name);
      b.setAttribute('aria-current', it.id === currentId ? 'true' : 'false');
      var ti = document.createElement('img');
      ti.src = it.url;
      ti.alt = '';
      b.appendChild(ti);
      b.addEventListener('click', function () { currentId = it.id; render(); });

      var r = document.createElement('button');
      r.type = 'button';
      r.className = 'remove';
      r.setAttribute('aria-label', 'Remove ' + it.name);
      r.textContent = '×';
      r.addEventListener('click', function () { removeItem(it.id); });

      wrap.appendChild(b);
      wrap.appendChild(r);
      strip.appendChild(wrap);
    });
  }

  function removeItem(id) {
    var idx = -1;
    items.forEach(function (it, i) { if (it.id === id) idx = i; });
    if (idx < 0) return;
    URL.revokeObjectURL(items[idx].url);
    items.splice(idx, 1);
    if (currentId === id) {
      var next = items[idx] || items[idx - 1];
      currentId = next ? next.id : null;
    }
    render();
  }

  clearBtn.addEventListener('click', function () {
    items.forEach(function (it) { URL.revokeObjectURL(it.url); });
    items = [];
    currentId = null;
    render();
  });

  fileInput.addEventListener('change', function () {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove('drag'); });
  });
  stage.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  document.addEventListener('paste', function (e) {
    var files = [];
    var cd = e.clipboardData;
    if (cd && cd.items) {
      for (var i = 0; i < cd.items.length; i++) {
        if (cd.items[i].kind === 'file') {
          var f = cd.items[i].getAsFile();
          if (f) files.push(f);
        }
      }
    }
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  // Start with a generated sample so the viewer shows something right away.
  function makeSample() {
    var c = document.createElement('canvas');
    c.width = 1200; c.height = 800;
    var g = c.getContext('2d');
    var grad = g.createLinearGradient(0, 0, 1200, 800);
    grad.addColorStop(0, '#2b3a42');
    grad.addColorStop(0.55, '#c4401a');
    grad.addColorStop(1, '#f2b66b');
    g.fillStyle = grad;
    g.fillRect(0, 0, 1200, 800);
    g.strokeStyle = 'rgba(255,255,255,0.28)';
    g.lineWidth = 2;
    for (var x = 0; x <= 1200; x += 100) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 800); g.stroke(); }
    for (var y = 0; y <= 800; y += 100) { g.beginPath(); g.moveTo(0, y); g.lineTo(1200, y); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.font = '600 56px sans-serif';
    g.fillText('Your image appears here', 80, 420);
    c.toBlob(function (blob) {
      if (!blob) { render(); return; }
      addBlob(blob, 'sample-gradient.png', true).then(function (it) {
        if (it && !items.some(function (x) { return !x.sample; })) currentId = it.id;
        render();
      });
    }, 'image/png');
  }

  render();
  try { makeSample(); } catch (err) { render(); }
})();
</script>

</body></html>
